[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kpnboxapi"
version = "0.2.0"
description = "Python library for interacting with KPN Box modem/router"
authors = [{name = "ssl", email = "git@elyesa.nl"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
keywords = ["kpn", "modem", "router", "api", "networking", "home automation"]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "responses>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "types-requests",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ssl/KPNBoxAPI"
Repository = "https://github.com/ssl/KPNBoxAPI.git"
Issues = "https://github.com/ssl/KPNBoxAPI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py38"
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long docstring lines and field descriptions
    "UP006", # keep typing.Dict/List while Python 3.8 is supported
    "UP007", # keep Optional/Union while Python 3.8 is supported
    "UP035",
]

[tool.mypy]
files = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
# Router responses are untyped JSON, so returning Any from them is expected.
warn_return_any = false
